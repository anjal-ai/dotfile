# ============================================================
# TERMINAL
# ============================================================
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ============================================================
# GENERAL
# ============================================================
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit tmux when closing a session
set -g escape-time 0            # Remove ESC delay (important for Neovim)
set -g history-limit 1000000    # Increase scrollback history
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Refresh status bar every 3 seconds
set -g allow-passthrough on     # Allow programs (e.g. image preview) to bypass tmux
set -g renumber-windows on      # Renumber windows when one is closed

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# ============================================================
# PREFIX
# ============================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # Press prefix twice to send it through

# ============================================================
# KEYBINDINGS
# ============================================================

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Split panes in current working directory
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current working directory
bind c new-window -c "#{pane_current_path}"

# Reattach session to current pane path (useful after cd)
bind M-c attach-session -c "#{pane_current_path}"

# Resize panes with vim keys (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Maximize/restore pane
bind -r m resize-pane -Z

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ============================================================
# COPY MODE (vi)
# ============================================================
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Don't exit copy mode on mouse drag end
unbind -T copy-mode-vi MouseDragEnd1Pane

# Paste with Prefix + P (uppercase; lowercase goes to prev window)
bind P paste-buffer

# ============================================================
# STATUS BAR — STYLE (Nord-inspired)
# ============================================================
gray_light="#D8DEE9"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position bottom
set -g status-style "fg=${gray_light},bg=default"
set -g status-left-length 100

set -g status-left  "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold] | "
set -g status-right " #{cpu}   #{mem} "
set -g status-justify centre

set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format         " #I:#W"

set -g message-style          "fg=${gray_light},bg=default"
set -g mode-style             "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style      "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"

# ============================================================
# PLUGINS (via TPM)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Navigate between nvim splits and tmux panes
set -g @plugin 'tmux-plugins/tmux-resurrect'      # Persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'      # Auto-save sessions every 15 min
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'   # CPU + memory in status bar

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'   # Uncomment to auto-restore on tmux start

# ============================================================
# Initialize TPM — must stay at the very bottom
# ============================================================
run '~/.tmux/plugins/tpm/tpm'
